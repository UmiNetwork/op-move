services:
  op-node:
    image: ghcr.io/uminetwork/op-node:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-node:latest-cache
      dockerfile: docker/shared/Dockerfile
      target: op-node
    env_file:
      - .env
    environment:
      JWT_SECRET: "f3099a1d969c4f5aba1a94434c368a84f8d950121feb4a398a67f78453853d1d"
      L1_RPC_URL: "http://geth:58138"
      L2_RPC_HTTP_URL: "http://op-move:8545"
      L2_RPC_AUTH_URL: "http://op-move:8551"
      RPC_PORT: 8547
      P2P_PORT: 9003
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared
      - ./docker/op-node/volume:/volume/host
    ports:
      - "9003/udp"
      - "9003/tcp"
      - "8547:8547"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  op-node-rep:
    image: ghcr.io/uminetwork/op-node-rep:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-node-rep:latest-cache
      dockerfile: docker/shared/Dockerfile
      target: op-node-rep
    env_file:
      - .env
    environment:
      JWT_SECRET: "f3099a1d969c4f5aba1a94434c368a84f8d950121feb4a398a67f78453853d1d"
      L1_RPC_URL: "http://geth:58138"
      L2_RPC_HTTP_URL: "http://op-move-rep:8545"
      L2_RPC_AUTH_URL: "http://op-move-rep:8551"
      RPC_PORT: 8547
      P2P_PORT: 9003
      SEQUENCER_PRIVATE_KEY: "0x589a8c172e0a5bd75a2d55e4ef71470bbf06776e7ab17124fb94cb92163bb05d"
      PEER_ADDR: op-node
      PEER_RPC_PORT: 8547
      PEER_P2P_PORT: 9003
    networks:
      - localnet
    depends_on:
      - op-node
    volumes:
      - ./docker/shared/volume:/volume/shared
      - ./docker/op-node-rep/volume:/volume/host
    ports:
      - "9003/udp"
      - "9003/tcp"
      - "8547"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  op-batcher:
    image: ghcr.io/uminetwork/op-batcher:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-batcher:latest-cache
      dockerfile: docker/shared/Dockerfile
      target: op-batcher
    env_file:
      - .env
    environment:
      L1_RPC_URL: "http://geth:58138"
      L2_RPC_URL: "http://op-move:8545"
      ROLLUP_RPC_URL: "http://op-node:8547"
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared

  op-proposer:
    image: ghcr.io/uminetwork/op-proposer:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-proposer:latest-cache
      dockerfile: docker/shared/Dockerfile
      target: op-proposer
    env_file:
      - .env
    environment:
      L1_RPC_URL: "http://geth:58138"
      ROLLUP_RPC_URL: "http://op-node:8547"
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared

  op-move:
    image: ghcr.io/uminetwork/op-move-rep:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-move-rep:latest-cache
      dockerfile: docker/op-move/Dockerfile
      args:
        - RUST_TOOLCHAIN
    environment:
      OP_MOVE_AUTH_JWT_SECRET: "f3099a1d969c4f5aba1a94434c368a84f8d950121feb4a398a67f78453853d1d"
      OP_MOVE_DB_PURGE: ${OP_MOVE_DB_PURGE:-false}
      L1_RPC_URL: "http://geth:58138"
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared
      - ./docker/op-move/volume:/volume/db
    ports:
      - "9000:9000"
      - "8545"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:8545/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  op-move-rep:
    image: ghcr.io/uminetwork/op-move:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/op-move:latest-cache
      dockerfile: docker/op-move/Dockerfile
      args:
        - RUST_TOOLCHAIN
    environment:
      OP_MOVE_AUTH_JWT_SECRET: "f3099a1d969c4f5aba1a94434c368a84f8d950121feb4a398a67f78453853d1d"
      OP_MOVE_DB_PURGE: ${OP_MOVE_DB_PURGE:-false}
      L1_RPC_URL: "http://geth:58138"
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared
      - ./docker/op-move-rep/volume:/volume/db
    ports:
      - "9001:9000"
      - "8545"
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: start-first
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://0.0.0.0:8545/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  geth:
    image: ghcr.io/uminetwork/geth:${UMI_TAG:-latest}
    build:
      cache_from:
        - type=registry,ref=ghcr.io/uminetwork/geth:latest-cache
      dockerfile: docker/shared/Dockerfile
      target: geth
    networks:
      - localnet
    volumes:
      - ./docker/shared/volume:/volume/shared
    ports:
      - "58138:58138"
    env_file:
      - .env

  proxy:
    image: nginx:1.29.1-alpine
    networks:
      - localnet
    depends_on:
      - op-move
    volumes:
      - ./docker/proxy/volume:/etc/nginx/conf.d:ro
    ports:
      - "8545:8545"

networks:
  localnet:
    external: true
